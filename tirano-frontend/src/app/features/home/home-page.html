@if (setting) {
  <div class="home-hero">
    <div class="container position-relative h-100">
      <div class="row align-items-center h-100">
        <!-- GAUCHE -->
        <div class="col-lg-6 hero-content">
          <!-- PETIT LABEL -->
          <!-- <div class="mb-3">
            <span class="badge bg-primary-subtle text-primary px-3 py-2">
              <i class="fa-solid fa-gears me-2"></i>
              Solutions techniques
            </span>
          </div> -->

          <!-- NOM DU SITE -->
          <h1 class="display-1 fw-bold mb-4 tirano-dark">
            {{ setting.siteName }}
          </h1>

          <!-- DESCRIPTION -->
          @if (setting.description) {
            <div
              class="fs-4 mb-4 hero-description tirano-dark"
              [innerHTML]="setting.description"
            ></div>
          }

          <!-- ACTIONS -->
          <div class="d-flex flex-wrap gap-3">
            <a href="#services" class="btn btn-light btn-lg px-4">
              <i class="fa-solid fa-gears me-2"></i>
              Nos services
            </a>

            <a href="#contact" class="btn btn-outline-light btn-lg px-4">
              <i class="fa-solid fa-envelope me-2"></i>
              Contactez-nous
            </a>
          </div>
        </div>

        <!-- DROITE -->
        <div class="col-lg-6">
          <div class="hero-image-wrapper">
            <img [src]="heroImage" [alt]="setting.siteName" class="img-fluid hero-image" />
          </div>
        </div>
      </div>
    </div>

    <!-- VAGUE BLANCHE -->
    <div class="hero-wave">
      <svg
        viewBox="0 0 1500 500"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="
            M0 25

            C100 25 180 25 260 35

            C360 50 430 90 500 150

            C580 220 630 330 720 400

            C830 480 980 485 1120 475

            C1260 465 1380 450 1500 400

            L1500 500

            L0 500

            Z
          "
          fill="#fff"
        />
      </svg>
    </div>
  </div>
}
