@if (setting) {
  <div class="container">
    <div class="row align-items-center g-5">
      <!-- GAUCHE -->
      <div class="col-lg-6">
        <span class="badge bg-primary-subtle text-primary px-3 py-2 mb-3">
          Solutions techniques
        </span>

        <h1 class="display-3 fw-bold mb-4">
          {{ setting.siteName }}
        </h1>

        @if (setting.description) {
          <div class="lead text-secondary mb-4" [innerHTML]="setting.description"></div>
        }

        <div class="d-flex flex-wrap gap-3">
          <a routerLink="/services" class="btn btn-primary btn-lg px-4">
            <i class="fa-solid fa-gears me-2"></i>
            Nos services
          </a>

          <a routerLink="/contact" class="btn btn-outline-primary btn-lg px-4">
            <i class="fa-solid fa-envelope me-2"></i>
            Contactez-nous
          </a>
        </div>
      </div>

      <!-- DROITE -->
      <div class="col-lg-6">
        <div class="hero-image-wrapper">
          <img
            [src]="heroImage"
            [alt]="setting.siteName"
            class="img-fluid rounded-4 shadow-lg hero-image"
          />
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="container">
    <div class="row align-items-center min-vh-100">
      <div class="col-12 text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden"> Chargement... </span>
        </div>
      </div>
    </div>
  </div>
}
