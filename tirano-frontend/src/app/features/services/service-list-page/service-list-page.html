<div class="container services-page" style="padding-top: 150px">
  <div class="section-header text-center">
    <h1 class="section-title tirano-light">Nos services</h1>

    <p class="section-subtitle">Découvrez nos solutions et services de forage.</p>
  </div>

  <div class="services-grid">
    @for (service of services; track service.id) {
      <article
        class="service-card"
        (click)="openGallery(service.title, service.description, service.medias)"
      >
        <!-- IMAGE -->
        <div class="service-image">
          <img
            [src]="settings.getImage(service.medias?.[0]?.url, 'service')"
            [alt]="service.title"
            loading="lazy"
          />

          <div class="service-image-overlay"></div>
        </div>

        <!-- CONTENU BAS -->
        <div class="service-content">
          <!-- TITRE -->
          <h3 class="service-title">
            {{ service.title }}
          </h3>

          <!-- DESCRIPTION AU SURVOL -->
          @if (service.description) {
            <p class="service-description">
              {{ service.description }}
            </p>
          }

          <!-- INDICATEUR -->
          <div class="service-action">
            <span>Découvrir</span>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </div>
      </article>
    }
  </div>
</div>
