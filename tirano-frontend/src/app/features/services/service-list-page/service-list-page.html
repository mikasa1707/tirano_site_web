<div class="container">
  <div class="section-header text-center">
    <h1 class="section-title tirano-dark">Nos services</h1>

    <p class="section-subtitle">Découvrez nos solutions et services de forage.</p>
  </div>

  <div class="services-grid">
    @for (service of services; track service.id) {
      <div class="services-item">
        <div class="card">
          <img
            [src]="settings.getImage(service.medias?.[0]?.url, 'service')"
            [alt]="service.title"
            class="img-fluid"
          />
          <div class="card-body">
            <h5 class="card-title">{{ service.title }}</h5>
            <p class="card-text">
              {{ service.description }}
            </p>
          </div>
          <div
            class="btn bg-primary card-footer d-flex justify-content-between align-items-center w-100 rounded-0"
            (click)="openGallery(service)"
          >
            <span>Galerie</span>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<app-gallery-viewer
  [gallery]="selectedGallery"
  [open]="galleryOpen"
  (galleryClosed)="closeGallery()"
>
</app-gallery-viewer>
