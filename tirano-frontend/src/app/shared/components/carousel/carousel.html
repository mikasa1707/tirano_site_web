@if (items.length) {
  <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      @for (item of items; track $index) {
        <button
          type="button"
          data-bs-target="#mainCarousel"
          [attr.data-bs-slide-to]="$index"
          [class.active]="$first"
        ></button>
      }
    </div>

    <div class="carousel-inner">
      @for (item of items; track item.image) {
        <div class="carousel-item" [class.active]="$first">
          <img [src]="item.image" class="d-block w-100" style="height: 550px; object-fit: cover" />

          <div class="carousel-caption">
            <h2>
              {{ item.title }}
            </h2>

            <p>
              {{ item.subtitle }}
            </p>

            @if (item.buttonText) {
              <a class="btn btn-primary" [routerLink]="item.buttonLink">
                {{ item.buttonText }}
              </a>
            }
          </div>
        </div>
      }
    </div>

    <button class="carousel-control-prev" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
}
