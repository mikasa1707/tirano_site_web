<div
  class="card border-0 text-white overflow-hidden"
  [style.background-image]="image ? 'url(' + image + ')' : ''"
  style="background-size: cover; background-position: center; min-height: 300px"
>
  <div
    class="card-body d-flex flex-column justify-content-center align-items-center text-center p-5"
    style="background: rgba(0, 0, 0, 0.55)"
  >
    <h2 class="fw-bold mb-3">
      {{ title }}
    </h2>

    @if (subtitle) {
      <p class="lead mb-4">
        {{ subtitle }}
      </p>
    }

    <a class="btn btn-primary btn-lg" [routerLink]="buttonLink">
      <i class="fas fa-arrow-right me-2"></i>

      {{ buttonText }}
    </a>
  </div>
</div>
