<input type="file" class="form-control mt-3" [multiple]="multiple" (change)="change($event)" />

@if (previews.length) {
  <div class="d-flex gap-2 flex-wrap mt-3">
    @for (preview of previews; track preview) {
      <img
        [src]="preview"
        class="img-thumbnail"
        style="width: 120px; height: 120px; object-fit: cover"
      />
    }
  </div>
}
