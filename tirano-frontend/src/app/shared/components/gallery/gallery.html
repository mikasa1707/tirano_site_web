<div class="row g-3">
  @for (item of items; track item.id) {
    <div [class]="itemClass">
      <div
        class="card h-100 shadow-sm position-relative"
        (click)="select.emit(item)"
        style="cursor: pointer"
      >
        @if (removable) {
          <button
            type="button"
            class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 z-1"
            (click)="onRemove(item); $event.stopPropagation()"
          >
            <i class="fa-solid fa-trash"></i>
          </button>
        }

        <!-- IMAGE -->
        @if (item.type === 'IMAGE') {
          <img
            [src]="item.url"
            [alt]="item.filename ?? item.title ?? 'Document'"
            class="card-img-top"
            style="height: 220px; object-fit: cover"
          />
        }

        <!-- VIDEO -->
        @else if (item.type === 'VIDEO') {
          <div
            class="position-relative d-flex align-items-center justify-content-center bg-dark"
            style="height: 220px"
          >
            <video
              [src]="item.url"
              muted
              preload="metadata"
              class="w-100 h-100"
              style="object-fit: cover"
            ></video>

            <i class="fa-solid fa-circle-play fa-3x text-white position-absolute"></i>
          </div>
        }

        <!-- DOCUMENT -->
        @else {
          <a
            class="btn btn-light d-flex flex-column justify-content-center align-items-center"
            [href]="item.url"
            target="_blank"
            style="height: 220px"
          >
            <i class="fa-solid fa-file-lines fa-3x text-secondary mb-3"></i>

            <span class="text-center small px-2 text-break">
              {{ item.filename ?? item.title ?? 'Document' }}
            </span>
          </a>
        }
      </div>
    </div>
  }
</div>
