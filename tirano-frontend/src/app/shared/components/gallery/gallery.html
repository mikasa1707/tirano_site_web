<div class="row g-3">
  @for (item of items; track item.id) {
    @if (item) {
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm gallery-card" (click)="select.emit(item)">
          @if (removable) {
            <button
              type="button"
              class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 z-1"
              (click)="onRemove(item); $event.stopPropagation()"
            >
              <i class="fa-solid fa-trash"></i>
            </button>
          }

          @if (item.type === 'IMAGE') {
            <img
              [src]="item.url"
              [alt]="item.title ?? 'Image'"
              class="card-img-top gallery-media"
            />
          }

          @if (item.type === 'VIDEO') {
            <div class="position-relative">
              <video
                [src]="item.url"
                muted
                preload="none"
                playsinline
                class="gallery-media"
              ></video>

              <div class="video-overlay">
                <i class="fa-solid fa-circle-play fa-3x text-dark"></i>
              </div>
            </div>
          }

          @if (item.type === 'PDF') {
            <div class="pdf-box">
              <i class="fa-solid fa-file-pdf fa-3x text-danger"></i>
            </div>
          }

          @if (item.title) {
            <div class="card-body p-2">
              <p class="mb-0 small text-muted">
                {{ item.title }}
              </p>
            </div>
          }
        </div>
      </div>
    }
  }
</div>
